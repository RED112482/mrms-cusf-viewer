services:
  - type: web
    name: mrms-cusf-viewer
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: MRMS_CACHE_DIR
        value: /tmp/mrms_unit_streamflow_cache
      - key: ENABLE_BACKGROUND_ARCHIVE
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: WEB_THREADS
        value: "4"
      - key: WEB_TIMEOUT
        value: "180"
