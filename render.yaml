services:
  - type: web
    name: mrms-cusf-viewer
    runtime: docker
    plan: free
    healthCheckPath: /api/metadata
    envVars:
      - key: MRMS_CACHE_DIR
        value: /tmp/mrms_unit_streamflow_cache
      - key: ENABLE_BACKGROUND_ARCHIVE
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WEB_THREADS
        value: "4"
      - key: WEB_TIMEOUT
        value: "180"
